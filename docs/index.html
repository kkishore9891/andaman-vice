<!-- Andaman Vice — GTA-style trip companion. Single-theme neon-night UI (deliberate). -->
<title>Andaman Vice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070919">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Big+Shoulders+Display:wght@500;700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   ANDAMAN VICE — neon-night pause-menu UI (single-theme, deliberate)
   Palette: ocean #070919/#0b0e2a · island #2a1e4f · shore #19e3d2
            route #ff4fa3 · sunset #ff8a3d · sand #ffd98a
            ink #f2ecff · muted #9a92c9
   Type:    Monoton (logo) · Big Shoulders Display (headings)
            Archivo (body) · IBM Plex Mono (data)
   ============================================================ */
:root{
  --ocean-0:#070919; --ocean-1:#0b0e2a; --ocean-2:#101440;
  --island:#2a1e4f; --island-hi:#3b2a6e; --shore:#19e3d2;
  --route:#ff4fa3; --sunset:#ff8a3d; --sand:#ffd98a;
  --ink:#f2ecff; --muted:#9a92c9; --line:#2c2757;
  --panel:rgba(13,12,38,.92); --panel-2:rgba(20,17,52,.94);
  --cat-travel:#ff4fa3; --cat-activity:#19e3d2; --cat-meal:#ff8a3d;
  --cat-sleep:#6a5fe0; --cat-prep:#8f86c9; --cat-scenic:#ffd98a;
  --disp:"Big Shoulders Display",system-ui,sans-serif;
  --body:"Archivo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ocean-0);color:var(--ink);font-family:var(--body);
     overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0}

/* ---------- map ---------- */
#mapwrap{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 70% 10%, #14104a 0%, var(--ocean-1) 45%, var(--ocean-0) 100%);
  perspective:1200px}
#mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(25,227,210,.016) 3px 4px)}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#tilt.on{transform:rotateX(16deg) scale(1.02)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
#map .island{fill:var(--island);stroke:var(--shore);stroke-width:1.1;
  filter:drop-shadow(0 10px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(25,227,210,.28))}
#map .island.dim{opacity:.5}
#map .route{fill:none;stroke:var(--route);stroke-width:2.4;stroke-linecap:round;
  opacity:.28}
#map .route.active{opacity:1;stroke-width:3.4;stroke-dasharray:10 8;
  animation:dash 1.2s linear infinite;
  filter:drop-shadow(0 0 8px rgba(255,79,163,.8))}
#map .route.sea{stroke-dasharray:2 8}
@keyframes dash{to{stroke-dashoffset:-18}}
#map .mk{cursor:pointer}
#map .mk circle{fill:var(--ocean-0);stroke:var(--sand);stroke-width:1.4}
#map .mk.active circle{stroke:var(--route);
  filter:drop-shadow(0 0 8px rgba(255,79,163,.9))}
#map .mk text{fill:var(--sand);font-family:var(--disp);font-weight:800;
  text-anchor:middle;pointer-events:none}
#map .mklabel{fill:var(--ink);font-family:var(--disp);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;
  stroke:rgba(7,9,25,.85);stroke-width:3px;pointer-events:none}
#map .you{fill:var(--route);
  filter:drop-shadow(0 0 10px rgba(255,79,163,1))}
#map .you-ring{fill:none;stroke:var(--route);opacity:.7;
  animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{r:6;opacity:.8}100%{r:26;opacity:0}}
#map .water-name{fill:#3f3a7d;font-family:var(--disp);font-weight:500;
  letter-spacing:.35em;text-transform:uppercase}

/* flight corridor overlay */
#flightlayer{position:absolute;inset:0;pointer-events:none}
#flightlayer .plane{position:absolute;font-size:22px;
  filter:drop-shadow(0 0 8px rgba(255,217,138,.9));transition:none}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;gap:14px;
  align-items:center;padding:12px 16px;
  background:linear-gradient(180deg,rgba(7,9,25,.92),rgba(7,9,25,0))}
#logo{font-family:"Monoton",cursive;font-size:clamp(17px,2.4vw,26px);
  color:var(--route);text-shadow:0 0 18px rgba(255,79,163,.75),0 0 42px rgba(255,79,163,.4);
  letter-spacing:.04em;user-select:none;white-space:nowrap}
#days{display:flex;gap:6px;flex-wrap:wrap}
.daytab{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.08em;
  padding:7px 12px 6px;border:1px solid var(--line);color:var(--muted);
  background:rgba(13,12,38,.7);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.daytab .d{color:var(--sand);margin-right:6px}
.daytab.on{color:var(--ink);border-color:var(--route);
  background:linear-gradient(90deg,rgba(255,79,163,.25),rgba(255,138,61,.18));
  box-shadow:0 0 14px rgba(255,79,163,.35)}
#hudright{margin-left:auto;display:flex;gap:6px}
.hudbtn{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.1em;
  padding:7px 10px;border:1px solid var(--line);color:var(--muted);
  background:rgba(13,12,38,.7)}
.hudbtn.on,.hudbtn:hover{color:var(--shore);border-color:var(--shore);
  box-shadow:0 0 10px rgba(25,227,210,.3)}
.hudbtn:focus-visible,#tl-play:focus-visible,.daytab:focus-visible{
  outline:2px solid var(--sand);outline-offset:2px}

/* ---------- sheets (legend / budget / intel / kit) ---------- */
.sheet{position:absolute;top:64px;right:12px;z-index:40;width:min(430px,92vw);
  max-height:calc(100% - 200px);overflow:auto;padding:18px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 18px 60px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.sheet h2{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.06em;
  color:var(--sand);text-transform:uppercase;margin-bottom:12px;text-wrap:balance}
.sheet h3{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.05em;
  color:var(--shore);text-transform:uppercase;margin:14px 0 6px}
.sheet p,.sheet li{font-size:13.5px;line-height:1.55;color:var(--ink);max-width:62ch}
.sheet .mut{color:var(--muted)}
.sheet table{width:100%;border-collapse:collapse;font-family:var(--mono);
  font-size:12.5px;font-variant-numeric:tabular-nums}
.sheet td,.sheet th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.sheet td.n,.sheet th.n{text-align:right}
.legend-row{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.swatch{width:22px;height:12px;border-radius:2px;flex:none}
.hidden{display:none !important}

/* ---------- mission briefing panel ---------- */
#brief{position:absolute;top:64px;left:12px;bottom:150px;z-index:40;
  width:min(470px,94vw);display:flex;flex-direction:column;
  background:var(--panel-2);border:1px solid var(--line);
  border-left:3px solid var(--route);
  box-shadow:0 18px 60px rgba(0,0,0,.65);backdrop-filter:blur(8px)}
#brief-head{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--line)}
#brief-crumbs{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--disp);
  font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
#brief-crumbs .crumb{color:var(--muted);cursor:pointer}
#brief-crumbs .crumb:hover{color:var(--shore)}
#brief-crumbs .crumb::after{content:"▸";margin:0 4px;color:var(--line)}
#brief-crumbs .crumb:last-child{color:var(--sand);cursor:default}
#brief-crumbs .crumb:last-child::after{content:""}
#brief-close{margin-left:auto;color:var(--muted);font-size:15px;padding:2px 6px}
#brief-close:hover{color:var(--route)}
#brief-body{overflow:auto;padding:14px 16px 20px}
#brief-body h1{font-family:var(--disp);font-weight:800;font-size:26px;
  letter-spacing:.04em;text-transform:uppercase;line-height:1.05;
  margin:2px 0 4px;text-wrap:balance}
.cat-chip{display:inline-block;font-family:var(--disp);font-weight:700;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;padding:3px 8px 2px;margin-bottom:10px;
  color:var(--ocean-0);border-radius:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.stat{border:1px solid var(--line);padding:8px 10px;background:rgba(7,9,25,.5)}
.stat .k{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:15px;color:var(--ink);margin-top:3px;
  font-variant-numeric:tabular-nums}
.stat .v small{color:var(--muted);font-size:11px}
#brief-body .photo{width:100%;border:1px solid var(--line);margin:6px 0 12px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#brief-body p{font-size:13.5px;line-height:1.6;margin:8px 0;max-width:64ch}
#brief-body .tips{border-left:3px solid var(--sunset);padding:8px 12px;margin:10px 0;
  background:rgba(255,138,61,.07);font-size:13px;line-height:1.55}
#brief-body .src{font-size:11.5px;color:var(--muted);word-break:break-all;
  margin-top:12px;line-height:1.6}
#brief-body .src a{color:var(--shore);text-decoration:none}
.kids{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.kid{display:flex;gap:10px;align-items:baseline;padding:8px 10px;cursor:pointer;
  border:1px solid var(--line);background:rgba(7,9,25,.45)}
.kid:hover{border-color:var(--route)}
.kid .t{font-family:var(--mono);font-size:12px;color:var(--sand);
  font-variant-numeric:tabular-nums;flex:none}
.kid .n{font-size:13.5px}
.kid .arr{margin-left:auto;color:var(--muted)}

/* ---------- timeline ---------- */
#timeline{position:absolute;left:0;right:0;bottom:0;z-index:35;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(7,9,25,.96) 70%,rgba(7,9,25,0))}
#tl-controls{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#tl-play{width:34px;height:34px;border:1px solid var(--shore);color:var(--shore);
  font-size:15px;flex:none}
#tl-play.playing{color:var(--route);border-color:var(--route);
  box-shadow:0 0 12px rgba(255,79,163,.4)}
#tl-speed{background:var(--ocean-1);color:var(--muted);border:1px solid var(--line);
  font-family:var(--mono);font-size:12px;padding:4px}
#tl-clock{font-family:var(--mono);font-size:20px;color:var(--sand);
  font-variant-numeric:tabular-nums;min-width:64px}
#tl-now{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:15px;
  text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#tl-strip{position:relative;height:34px;border:1px solid var(--line);
  background:rgba(13,12,38,.8);cursor:crosshair}
#tl-blocks{position:absolute;inset:0}
.blk{position:absolute;top:0;bottom:0;opacity:.85}
.blk:hover{opacity:1;outline:1px solid var(--ink)}
.blk.sel{outline:2px solid var(--ink);opacity:1;z-index:2}
#tl-cursor{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--sand);
  box-shadow:0 0 10px rgba(255,217,138,.9);pointer-events:none}
#tl-hours{position:relative;height:14px;font-family:var(--mono);font-size:9.5px;
  color:var(--muted)}
#tl-hours span{position:absolute;transform:translateX(-50%)}

/* ---------- boot ---------- */
#boot{position:absolute;inset:0;z-index:100;display:flex;align-items:center;
  justify-content:center;background:var(--ocean-0);
  font-family:var(--disp);font-weight:800;font-size:clamp(18px,4vw,34px);
  letter-spacing:.3em;color:var(--shore);
  text-shadow:0 0 24px rgba(25,227,210,.6);animation:bootpulse 1.4s ease infinite}
@keyframes bootpulse{50%{opacity:.45}}

/* ---------- mobile ---------- */
@media (max-width:760px){
  #hud{flex-wrap:wrap;gap:8px;padding:10px}
  #brief{left:0;right:0;top:auto;bottom:0;width:100%;max-height:72vh;
    border-left:1px solid var(--line);border-top:3px solid var(--route);z-index:60}
  .sheet{top:auto;bottom:0;right:0;left:0;width:100%;max-height:70vh;z-index:55}
  #tl-now{display:none}
}
@media (prefers-reduced-motion:reduce){
  #map .route.active,#map .you-ring,#boot{animation:none}
  #tilt{transition:none}
}

</style>

<div id="app">
  <!-- MAP LAYER -->
  <div id="mapwrap">
    <div id="tilt">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="flightlayer"></div>
  </div>

  <!-- HUD: top bar -->
  <header id="hud">
    <div id="logo">ANDAMAN&nbsp;VICE</div>
    <nav id="days"></nav>
    <div id="hudright">
      <button class="hudbtn" id="btn-legend" title="Legend">LEGEND</button>
      <button class="hudbtn" id="btn-budget" title="Budget">₹</button>
      <button class="hudbtn" id="btn-intel" title="Facts &amp; sources">INTEL</button>
      <button class="hudbtn" id="btn-kit" title="Clothing &amp; packing">KIT</button>
      <button class="hudbtn" id="btn-tilt" title="Toggle 2.5D tilt">2.5D</button>
    </div>
  </header>

  <!-- Legend -->
  <aside id="legend" class="sheet hidden"></aside>
  <!-- Budget / Intel / Kit sheets -->
  <aside id="budget" class="sheet hidden"></aside>
  <aside id="intel" class="sheet hidden"></aside>
  <aside id="kit" class="sheet hidden"></aside>

  <!-- Mission briefing (event detail) -->
  <aside id="brief" class="hidden">
    <div id="brief-head">
      <div id="brief-crumbs"></div>
      <button id="brief-close">✕</button>
    </div>
    <div id="brief-body"></div>
  </aside>

  <!-- Timeline -->
  <footer id="timeline">
    <div id="tl-controls">
      <button id="tl-play" title="Simulate">▶</button>
      <select id="tl-speed">
        <option value="10">10×</option>
        <option value="60" selected>60×</option>
        <option value="300">300×</option>
        <option value="900">900×</option>
      </select>
      <div id="tl-clock">--:--</div>
      <div id="tl-now">select a day</div>
    </div>
    <div id="tl-strip"><div id="tl-blocks"></div><div id="tl-cursor"></div></div>
    <div id="tl-hours"></div>
  </footer>

  <div id="boot">LOADING&nbsp;TRIP&nbsp;DATA…</div>
</div>

<script>
/* VMap — neon SVG map: real coastline polys, markers, routes, sim marker, pan/zoom. */
const VMap = (() => {
  const NS = "http://www.w3.org/2000/svg";
  let svg, gIsl, gRoute, gMk, gYou, proj, vb, cb = {};
  let W = 1000, H = 1000;

  function el(n, at, parent) {
    const e = document.createElementNS(NS, n);
    for (const k in at) e.setAttribute(k, at[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function makeProj(bbox) {
    const [x0, y0, x1, y1] = bbox;                 // lon/lat
    const midLat = (y0 + y1) / 2;
    const kx = Math.cos(midLat * Math.PI / 180);
    const aspect = ((x1 - x0) * kx) / (y1 - y0);
    W = 1000; H = W / aspect;
    return (lat, lng) => [
      (lng - x0) / (x1 - x0) * W,
      (y1 - lat) / (y1 - y0) * H,
    ];
  }

  function init(svgEl, geo, opts = {}) {
    svg = svgEl; cb = opts;
    // pad bbox 4%
    const b = geo.bbox.slice();
    const px = (b[2] - b[0]) * 0.04, py = (b[3] - b[1]) * 0.04;
    proj = makeProj([b[0] - px, b[1] - py, b[2] + px, b[3] + py]);
    vb = { x: 0, y: 0, w: W, h: H };
    apply();
    svg.innerHTML = "";
    const gWater = el("g", {}, svg);
    gIsl = el("g", {}, svg);
    gRoute = el("g", {}, svg);
    gMk = el("g", {}, svg);
    gYou = el("g", {}, svg);
    // sea name
    el("text", { class: "water-name", x: W * 0.55, y: H * 0.5, "font-size": W / 34 },
      gWater).textContent = "ANDAMAN SEA";
    for (const isl of geo.islands) {
      const d = isl.points.map((p, i) => {
        const [x, y] = proj(p[1], p[0]);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join("") + "Z";
      el("path", { class: "island", d }, gIsl);
    }
    bindPanZoom();
  }

  function apply() {
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    // keep marker/label sizes readable at any zoom
    const s = vb.w / W;
    svg.style.setProperty("--zs", s);
    for (const t of svg.querySelectorAll(".mk circle"))
      t.setAttribute("r", 8 * s + "");
    for (const t of svg.querySelectorAll(".mk text"))
      t.setAttribute("font-size", 9 * s + "");
    for (const t of svg.querySelectorAll(".mklabel"))
      t.setAttribute("font-size", 10.5 * s + "");
    for (const t of svg.querySelectorAll(".you"))
      t.setAttribute("r", 5.5 * s + "");
  }

  function markers(places) {
    gMk.innerHTML = "";
    for (const p of places) {
      if (p.lat == null || p.island === "chennai" || p.island === "air") continue;
      const [x, y] = proj(p.lat, p.lng);
      const g = el("g", { class: "mk", "data-id": p.id }, gMk);
      el("circle", { cx: x, cy: y, r: 8 }, g);
      const ic = el("text", { x, y: y + 3 }, g);
      ic.textContent = (p.kind || "?")[0].toUpperCase();
      const lb = el("text", { class: "mklabel", x: x + 12, y: y + 4 }, g);
      lb.textContent = p.name;
      g.addEventListener("click", () => cb.onPlace && cb.onPlace(p.id));
    }
    apply();
  }

  function routes(rs) {
    gRoute.innerHTML = "";
    for (const r of rs) {
      let pts = [];
      try { pts = JSON.parse(r.polyline || "[]"); } catch (e) {}
      if (pts.length < 2) continue;
      const d = pts.map((p, i) => {
        const [x, y] = proj(p[0], p[1]);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join("");
      const cls = "route" + (["ferry", "boat", "flight"].includes(r.mode) ? " sea" : "");
      el("path", { class: cls, d, "data-id": r.id }, gRoute);
    }
  }

  function activeRoute(id) {
    for (const p of gRoute.querySelectorAll(".route"))
      p.classList.toggle("active", p.dataset.id === id);
  }
  function activePlace(id) {
    for (const m of gMk.querySelectorAll(".mk"))
      m.classList.toggle("active", m.dataset.id === id);
  }

  function you(lat, lng) {
    gYou.innerHTML = "";
    if (lat == null) return;
    const [x, y] = proj(lat, lng);
    el("circle", { class: "you-ring", cx: x, cy: y, r: 6 }, gYou);
    el("circle", { class: "you", cx: x, cy: y, r: 5.5 }, gYou);
    apply();
  }

  function focusLatLng(lat, lng, zoom = 3) {
    const [x, y] = proj(lat, lng);
    const w = W / zoom, h = H / zoom;
    vb = { x: x - w / 2, y: y - h / 2, w, h };
    apply();
  }
  function focusAll() { vb = { x: 0, y: 0, w: W, h: H }; apply(); }

  /* --- interpolate along a route polyline, t in 0..1 → [lat,lng] --- */
  function pointAlong(r, t) {
    let pts = [];
    try { pts = JSON.parse(r.polyline || "[]"); } catch (e) { return null; }
    if (pts.length < 2) return null;
    const segs = []; let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0],
        (pts[i][1] - pts[i - 1][1]) * Math.cos(pts[i][0] * Math.PI / 180));
      segs.push(d); total += d;
    }
    let want = t * total;
    for (let i = 0; i < segs.length; i++) {
      if (want <= segs[i] || i === segs.length - 1) {
        const f = segs[i] ? want / segs[i] : 0;
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
                pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
      }
      want -= segs[i];
    }
    return pts[pts.length - 1];
  }

  /* --- pan / zoom --- */
  function bindPanZoom() {
    let drag = null, pinch = null;
    svg.addEventListener("wheel", (e) => {
      e.preventDefault();
      const f = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      zoomAt(e.clientX, e.clientY, f);
    }, { passive: false });
    svg.addEventListener("pointerdown", (e) => {
      svg.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY, vb: { ...vb } };
    });
    svg.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const r = svg.getBoundingClientRect();
      const sc = vb.w / r.width;
      vb.x = drag.vb.x - (e.clientX - drag.x) * sc;
      vb.y = drag.vb.y - (e.clientY - drag.y) * sc;
      apply();
    });
    svg.addEventListener("pointerup", () => drag = null);
    svg.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        drag = null;
        pinch = { d: dist(e.touches), vb: { ...vb } };
      }
    }, { passive: true });
    svg.addEventListener("touchmove", (e) => {
      if (pinch && e.touches.length === 2) {
        const f = pinch.d / dist(e.touches);
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        vb = { ...pinch.vb };
        zoomAt(cx, cy, f);
      }
    }, { passive: true });
    svg.addEventListener("touchend", () => pinch = null);
    function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  }
  function zoomAt(cx, cy, f) {
    const r = svg.getBoundingClientRect();
    const mx = vb.x + (cx - r.left) / r.width * vb.w;
    const my = vb.y + (cy - r.top) / r.height * vb.h;
    let w = vb.w * f;
    w = Math.max(W / 40, Math.min(W * 1.6, w));
    const h = w * vb.h / vb.w;
    vb = { x: mx - (mx - vb.x) * (w / vb.w), y: my - (my - vb.y) * (h / vb.h), w, h };
    apply();
  }

  return { init, markers, routes, activeRoute, activePlace, you,
           focusLatLng, focusAll, pointAlong, proj: (a, b) => proj(a, b) };
})();

</script>
<script>
/* Andaman Vice — app: data, day tabs, minute timeline, simulation, briefing panel. */
(async () => {
  const $ = (s) => document.querySelector(s);
  const CAT = { travel: "--cat-travel", activity: "--cat-activity", meal: "--cat-meal",
    sleep: "--cat-sleep", prep: "--cat-prep", buffer: "--cat-prep", scenic: "--cat-scenic" };
  const catColor = (c) =>
    getComputedStyle(document.documentElement).getPropertyValue(CAT[c] || "--cat-prep").trim();

  /* ---------- data ---------- */
  async function loadData() {
    if (window.TRIP_DATA) return window.TRIP_DATA;
    for (const u of ["/api/trip", "data.json"]) {
      try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {}
    }
    return null;
  }
  const D = await loadData();
  if (!D || !D.events || !D.events.length) {
    $("#boot").textContent = "NO TRIP DATA YET — RESEARCH IN PROGRESS";
    return;
  }

  const places = Object.fromEntries(D.places.map(p => [p.id, p]));
  const routesById = Object.fromEntries(D.routes.map(r => [r.id, r]));
  const ev = Object.fromEntries(D.events.map(e => [e.id, e]));
  const kids = {};
  for (const e of D.events) (kids[e.parent_id || "_root"] ||= []).push(e);
  for (const k in kids) kids[k].sort((a, b) => (a.seq || 0) - (b.seq || 0) ||
    (a.start_min || 0) - (b.start_min || 0));
  const isLeaf = (e) => !(kids[e.id] && kids[e.id].length);
  const leaves = D.events.filter(e => isLeaf(e) && e.start_min != null)
    .sort((a, b) => a.start_min - b.start_min);
  const meta = Object.fromEntries((D.meta || []).map(m => [m.k, m.v]));
  const T0 = new Date(D.t0.replace("+05:30", ""));  // treat as wall-clock IST
  const L0 = +meta.ledger_start_min || 0, L1 = +meta.ledger_end_min || 0;

  const fmtT = (m) => {
    const d = new Date(T0.getTime() + m * 60000);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  const fmtDur = (mins) => {
    const h = Math.floor(mins / 60), m = mins % 60;
    return (h ? h + "h " : "") + (m || !h ? m + "m" : "");
  };
  const INR = (v) => "₹" + Math.round(v).toLocaleString("en-IN");
  const dayStart = (day) => (day - 1) * 1440;   // day 1 = Sep 23 00:00 IST
  const DAYNAMES = ["WED 23", "THU 24", "FRI 25", "SAT 26", "SUN 27"];

  /* ---------- map ---------- */
  let geo = null;
  try { const r = await fetch("assets/map_geo.json"); if (r.ok) geo = await r.json(); } catch (e) {}
  if (!geo && window.MAP_GEO) geo = window.MAP_GEO;
  if (!geo) geo = { bbox: [92.3, 11.3, 93.2, 12.45], islands: [] };
  VMap.init($("#map"), geo, { onPlace: (id) => { const e = leaves.find(l => l.place_id === id); if (e) openBrief(e.id); } });
  VMap.markers(D.places);
  VMap.routes(D.routes);

  /* ---------- day tabs ---------- */
  let curDay = 1, simMin = L0, playing = false, selBlock = null;
  const daysEl = $("#days");
  for (let d = 1; d <= 5; d++) {
    const b = document.createElement("button");
    b.className = "daytab"; b.innerHTML = `<span class="d">${d}</span>${DAYNAMES[d - 1]}`;
    b.onclick = () => setDay(d, true);
    daysEl.appendChild(b);
  }

  /* ---------- timeline ---------- */
  const strip = $("#tl-strip"), blocksEl = $("#tl-blocks"), cursor = $("#tl-cursor");
  function setDay(d, jump) {
    curDay = d;
    [...daysEl.children].forEach((b, i) => b.classList.toggle("on", i === d - 1));
    blocksEl.innerHTML = "";
    const s = dayStart(d), e = s + 1440;
    for (const lf of leaves) {
      if (lf.end_min <= s || lf.start_min >= e) continue;
      const a = Math.max(lf.start_min, s), b = Math.min(lf.end_min, e);
      const div = document.createElement("div");
      div.className = "blk";
      div.style.left = ((a - s) / 1440 * 100) + "%";
      div.style.width = (Math.max(b - a, 4) / 1440 * 100) + "%";
      div.style.background = catColor(lf.category);
      div.title = fmtT(lf.start_min) + "–" + fmtT(lf.end_min) + "  " + lf.title;
      div.dataset.id = lf.id;
      div.onclick = (evx) => { evx.stopPropagation(); setMinute(a); openBrief(lf.id); };
      blocksEl.appendChild(div);
    }
    const hrs = $("#tl-hours"); hrs.innerHTML = "";
    for (let h = 0; h <= 24; h += 3) {
      const sp = document.createElement("span");
      sp.style.left = (h / 24 * 100) + "%";
      sp.textContent = String(h).padStart(2, "0");
      hrs.appendChild(sp);
    }
    if (jump) setMinute(Math.max(s, Math.min(e - 1, Math.max(L0, s))));
  }
  strip.onclick = (e) => {
    const r = strip.getBoundingClientRect();
    setMinute(dayStart(curDay) + Math.round((e.clientX - r.left) / r.width * 1440));
  };

  function leafAt(t) {
    for (const lf of leaves) if (lf.start_min <= t && lf.end_min > t) return lf;
    return null;
  }

  function setMinute(t) {
    simMin = Math.max(L0, Math.min(L1 - 1, t));
    const d = Math.floor(simMin / 1440) + 1;
    if (d !== curDay && d >= 1 && d <= 5) setDay(d, false);
    cursor.style.left = ((simMin - dayStart(curDay)) / 1440 * 100) + "%";
    $("#tl-clock").textContent = fmtT(simMin);
    const lf = leafAt(simMin);
    if (lf) {
      $("#tl-now").textContent = lf.title;
      if (selBlock) selBlock.classList.remove("sel");
      selBlock = blocksEl.querySelector(`[data-id="${lf.id}"]`);
      if (selBlock) selBlock.classList.add("sel");
      // position marker
      const r = lf.route_id && routesById[lf.route_id];
      if (r && r.polyline) {
        const f = (simMin - lf.start_min) / (lf.end_min - lf.start_min);
        const p = VMap.pointAlong(r, f);
        if (p) VMap.you(p[0], p[1]);
        VMap.activeRoute(lf.route_id); VMap.activePlace(null);
        plane(r, f, lf);
      } else {
        const pl = lf.place_id && places[lf.place_id];
        if (pl && pl.lat != null) VMap.you(pl.lat, pl.lng);
        VMap.activeRoute(null); VMap.activePlace(lf.place_id);
        plane(null);
      }
    }
  }

  /* flight overlay: plane emoji sweeping the screen for air legs (Chennai off-map) */
  function plane(route, f, lf) {
    const lay = $("#flightlayer");
    if (!route || route.mode !== "flight") { lay.innerHTML = ""; return; }
    let p = lay.querySelector(".plane");
    if (!p) { p = document.createElement("div"); p.className = "plane"; p.textContent = "✈️"; lay.appendChild(p); }
    const wr = lay.getBoundingClientRect();
    const east = lf.title.toLowerCase().includes("chennai") && lf.end_min < 3 * 1440; // outbound
    const x0 = -30, x1 = wr.width * 0.62, y0 = wr.height * 0.32, y1 = wr.height * 0.45;
    const t = east ? f : 1 - f;
    p.style.left = (x0 + (x1 - x0) * t) + "px";
    p.style.top = (y0 + (y1 - y0) * t) + "px";
    p.style.transform = east ? "" : "scaleX(-1)";
  }

  /* ---------- simulation ---------- */
  let lastTs = 0, raf = 0;
  const playBtn = $("#tl-play");
  playBtn.onclick = () => { playing ? stop() : play(); };
  function play() {
    playing = true; playBtn.textContent = "❚❚"; playBtn.classList.add("playing");
    lastTs = performance.now(); raf = requestAnimationFrame(tick);
  }
  function stop() {
    playing = false; playBtn.textContent = "▶"; playBtn.classList.remove("playing");
    cancelAnimationFrame(raf);
  }
  function tick(ts) {
    if (!playing) return;
    const sp = +$("#tl-speed").value;             // sim-minutes per real minute
    const dm = (ts - lastTs) / 60000 * sp;
    lastTs = ts;
    if (simMin + dm >= L1 - 1) { setMinute(L1 - 1); stop(); return; }
    setMinute(simMin + dm);
    raf = requestAnimationFrame(tick);
  }

  /* ---------- briefing panel ---------- */
  const brief = $("#brief");
  $("#brief-close").onclick = () => brief.classList.add("hidden");
  function crumbs(e) {
    const c = [];
    let cur = e;
    while (cur) { c.unshift(cur); cur = cur.parent_id ? ev[cur.parent_id] : null; }
    return c;
  }
  function openBrief(id) {
    const e = ev[id]; if (!e) return;
    brief.classList.remove("hidden");
    const cr = $("#brief-crumbs"); cr.innerHTML = "";
    for (const c of crumbs(e)) {
      const s = document.createElement("span");
      s.className = "crumb"; s.textContent = c.title;
      if (c.id !== e.id) s.onclick = () => openBrief(c.id);
      cr.appendChild(s);
    }
    const b = $("#brief-body"); b.innerHTML = "";
    const h = document.createElement("h1"); h.textContent = e.title; b.appendChild(h);
    if (e.category) {
      const chip = document.createElement("span");
      chip.className = "cat-chip"; chip.textContent = e.category;
      chip.style.background = catColor(e.category); b.appendChild(chip);
    }
    const r = e.route_id && routesById[e.route_id];
    const pl = e.place_id && places[e.place_id];
    const stats = [];
    if (e.start_min != null) {
      stats.push(["Start", fmtT(e.start_min)], ["End", fmtT(e.end_min)],
        ["Duration", fmtDur(e.end_min - e.start_min)]);
    }
    if (r) {
      if (r.distance_km) stats.push(["Distance", r.distance_km + " km"]);
      if (r.duration_min) stats.push(["Travel time", fmtDur(r.duration_min)]);
      if (r.fuel_l) stats.push(["Fuel (2 scooters)",
        r.fuel_l.toFixed(2) + " L <small>" + INR(r.fuel_cost_inr || 0) + "</small>"]);
      stats.push(["Mode", r.mode]);
    }
    if (e.cost_inr) stats.push(["Cost (3 pax)", INR(e.cost_inr)]);
    const sg = document.createElement("div"); sg.className = "statgrid";
    for (const [k, v] of stats) {
      const d = document.createElement("div"); d.className = "stat";
      d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
      sg.appendChild(d);
    }
    b.appendChild(sg);
    if (pl && pl.photo) {
      const img = document.createElement("img");
      img.className = "photo"; img.src = pl.photo; img.alt = pl.name;
      img.loading = "lazy"; b.appendChild(img);
    }
    for (const txt of [e.details, pl && pl.blurb]) {
      if (!txt) continue;
      for (const para of String(txt).split(/\n\n+/)) {
        const p = document.createElement("p"); p.textContent = para; b.appendChild(p);
      }
    }
    if (e.cost_note) {
      const p = document.createElement("p"); p.className = "mut";
      p.textContent = "Cost detail: " + e.cost_note; b.appendChild(p);
    }
    if (e.tips) {
      const t = document.createElement("div"); t.className = "tips";
      t.textContent = e.tips; b.appendChild(t);
    }
    if (kids[e.id]) {
      const kd = document.createElement("div"); kd.className = "kids";
      for (const k of kids[e.id]) {
        const row = document.createElement("div"); row.className = "kid";
        row.innerHTML = `<span class="t">${k.start_min != null ? fmtT(k.start_min) : ""}</span>
          <span class="n">${k.title}</span><span class="arr">▸</span>`;
        row.onclick = () => openBrief(k.id);
        kd.appendChild(row);
      }
      b.appendChild(kd);
    }
    const srcs = [e.source_url, r && r.source_url, pl && pl.source_url].filter(Boolean);
    if (srcs.length) {
      const s = document.createElement("div"); s.className = "src";
      s.innerHTML = "SOURCES · " + srcs.map(u =>
        `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "").slice(0, 60)}</a>`
      ).join(" · ");
      b.appendChild(s);
    }
    // focus map
    if (r && r.polyline) {
      VMap.activeRoute(r.id);
      const p = VMap.pointAlong(r, 0.5); if (p) VMap.focusLatLng(p[0], p[1], 2);
    } else if (pl && pl.lat != null) {
      VMap.activePlace(pl.id); VMap.focusLatLng(pl.lat, pl.lng, 5);
    }
    if (e.start_min != null && (simMin < e.start_min || simMin >= e.end_min))
      setMinute(e.start_min);
  }

  /* ---------- sheets ---------- */
  const sheets = { legend: $("#legend"), budget: $("#budget"), intel: $("#intel"), kit: $("#kit") };
  function toggleSheet(name) {
    for (const k in sheets) sheets[k].classList.toggle("hidden", k !== name || !sheets[k].classList.contains("hidden"));
  }
  $("#btn-legend").onclick = () => toggleSheet("legend");
  $("#btn-budget").onclick = () => toggleSheet("budget");
  $("#btn-intel").onclick = () => toggleSheet("intel");
  $("#btn-kit").onclick = () => toggleSheet("kit");
  $("#btn-tilt").onclick = () => {
    $("#tilt").classList.toggle("on");
    $("#btn-tilt").classList.toggle("on");
  };

  // legend
  sheets.legend.innerHTML = "<h2>Legend</h2>" +
    Object.entries({ travel: "Travel leg", activity: "Mission / activity", meal: "Food stop",
      sleep: "Sleep", prep: "Prep · buffer · check-in", scenic: "Scenic / sunset / sunrise" })
      .map(([c, l]) => `<div class="legend-row"><span class="swatch" style="background:${catColor(c)}"></span>${l}</div>`)
      .join("") +
    `<h3>Map</h3>
     <div class="legend-row"><span class="swatch" style="background:var(--route)"></span>Neon line = your route (animated = live leg)</div>
     <div class="legend-row"><span class="swatch" style="background:var(--sand)"></span>Chips = places (letter = kind: B beach, J jetty, A airport, H hotel, R restaurant…)</div>
     <p class="mut">Scroll / pinch to zoom · drag to pan · click any chip or timeline block for the mission briefing.</p>`;

  // budget rollup
  function buildBudget() {
    const rows = leaves.filter(e => e.cost_inr > 0);
    const byDay = {}; let total = 0;
    for (const e of rows) {
      const d = Math.floor(e.start_min / 1440) + 1;
      (byDay[d] ||= []).push(e); total += e.cost_inr;
    }
    let html = "<h2>Budget — crew of 3</h2>";
    for (let d = 1; d <= 5; d++) {
      if (!byDay[d]) continue;
      const sub = byDay[d].reduce((s, e) => s + e.cost_inr, 0);
      html += `<h3>Day ${d} · ${DAYNAMES[d - 1]} — ${INR(sub)}</h3><table>` +
        byDay[d].map(e => `<tr><td>${fmtT(e.start_min)}</td><td>${e.title}</td>
          <td class="n">${INR(e.cost_inr)}</td></tr>`).join("") + "</table>";
    }
    html += `<h3>Total</h3><table><tr><th>Grand total (3 pax, ex-shopping)</th>
      <th class="n">${INR(total)}</th></tr></table>
      <p class="mut">Every figure carries its source in the event briefing. Prices captured live; recheck before paying.</p>`;
    sheets.budget.innerHTML = html;
  }
  buildBudget();

  // intel (facts & verification)
  function buildIntel() {
    const badge = (v) => ({ confirmed: "✅", reported: "📋", unverifiable: "❓" }[v] || "🛠");
    sheets.intel.innerHTML = "<h2>Intel — verified facts</h2><table>" +
      (D.facts || []).map(f => `<tr><td>${badge(f.verified)}</td>
        <td>${f.topic}<br><span class="mut">${f.value}</span><br>
        <a class="mut" href="${f.source_url}" target="_blank" rel="noopener">source</a>
        <span class="mut"> · ${f.as_of || ""}</span></td></tr>`).join("") + "</table>";
  }
  buildIntel();

  // kit (packing) — authored into meta.kit as JSON [[section,[items]],...]
  function buildKit() {
    let kit = [];
    try { kit = JSON.parse(meta.kit || "[]"); } catch (e) {}
    sheets.kit.innerHTML = "<h2>Kit — what to wear &amp; carry</h2>" +
      (kit.length ? kit.map(([sec, items]) =>
        `<h3>${sec}</h3><ul>` + items.map(i => `<li>${i}</li>`).join("") + "</ul>").join("")
        : "<p class='mut'>Packing list lands after weather research.</p>");
  }
  buildKit();

  /* ---------- boot ---------- */
  $("#boot").remove();
  $("#tilt").classList.add("on"); $("#btn-tilt").classList.add("on");
  setDay(1, false);
  setMinute(L0);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(() => {});
})();

</script>
